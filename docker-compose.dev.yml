# Local development database only (for `npm run dev` in backend/).
# Separate project, port and volume from production.
name: qbadminton-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qbadminton
      POSTGRES_USER: qbadminton
      POSTGRES_PASSWORD: qbadminton
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - qbadminton-dev-postgres-data:/var/lib/postgresql/data

volumes:
  qbadminton-dev-postgres-data:
